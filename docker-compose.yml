services:
  switchboard:
    image: ghcr.io/bacnh85/a2a-switchboard:latest
    container_name: a2a-switchboard
    restart: unless-stopped
    ports:
      # Loopback by default (issue #4). To expose on the LAN, publish
      # "9920:9920" AND put a TLS terminator with auth in front — the admin
      # UI serves bearer tokens and is protected only by its password.
      - "127.0.0.1:9920:9920"
    volumes:
      - ./data:/data
    environment:
      # The container MUST bind 0.0.0.0 for the published port to be reachable
      # (the default 127.0.0.1 bind only works without port publishing).
      - AGW_BIND=0.0.0.0:9920
      - AGW_DATA_DIR=/data
      # Optional overrides; see docs/DEPLOYMENT.md:
      # - AGW_COOKIE_SECURE=1    # when a TLS terminator fronts the gateway
      # - AGW_ROUTING_LOG_MAX_MB=64
      # - AGW_AUDIT_PREVIEWS=true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9920 && echo >&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
