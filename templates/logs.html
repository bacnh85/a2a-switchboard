{% extends "layout.html" %}
{% block content %}
<h1>Communication log</h1>

<form method="get" action="/logs/full" class="filter-bar">
  <input type="text" name="src" placeholder="caller…" value="{{q_src}}" aria-label="filter by source">
  <input type="text" name="dst" placeholder="destination…" value="{{q_dst}}" aria-label="filter by destination">
  <input type="text" name="method" placeholder="method…" value="{{q_method}}" aria-label="filter by rpc or http method">
  <input type="text" name="status" placeholder="status…" value="{{q_status}}" aria-label="filter by status">
  <label class="chk"><input type="checkbox" name="errors" value="1" {% if errors_only %}checked{% endif %}> errors only</label>
  <button class="btn btn-primary" type="submit">Filter</button>
  <a class="btn" href="/logs/full">Clear</a>
  <a class="btn" href="/logs/export?src={{q_src|urlencode}}&dst={{q_dst|urlencode}}&method={{q_method|urlencode}}&status={{q_status|urlencode}}{% if errors_only %}&errors=1{% endif %}&n=5000">Export JSONL</a>
</form>

<div class="tbl-wrap" data-live data-live-src="/logs/full?src={{q_src|urlencode}}&dst={{q_dst|urlencode}}&method={{q_method|urlencode}}&status={{q_status|urlencode}}{% if errors_only %}&errors=1{% endif %}&fragment=1" data-live-on="route">
{% include "_logs_table.html" %}
</div>
<script src="/assets/expand.js"></script>
<script src="/assets/live.js" defer></script>
{% endblock %}
