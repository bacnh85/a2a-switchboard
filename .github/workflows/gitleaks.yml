name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4438e97e2e1e80fd842f559f0fa25247 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
