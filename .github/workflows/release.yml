name: Release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE: bacnh85/a2a-switchboard
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        run: |
          VER="${GITHUB_REF_NAME#v}"
          MAJOR="${VER%%.*}"
          MINOR="${VER%.*}"
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE }}:${VER},${{ env.REGISTRY }}/${{ env.IMAGE }}:${MINOR},${{ env.REGISTRY }}/${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=a2a-switchboard — self-hosted A2A switchboard
